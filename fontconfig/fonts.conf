<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Vercel 런타임의 기본 폰트 설정과 폴백도 유지한다. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- 이 파일과 같은 fontconfig/ 폴더의 ttf/otf를 스캔한다. -->
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/wnf-fontconfig-cache</cachedir>

  <!-- 파일 내부의 실제 family 이름과 무관하게 고정된 이름으로 재등록한다. -->
  <!-- Pretendard: 첫 글자를 생략해 Pretendard/pretendard 두 파일명 모두 허용. -->
  <match target="scan">
    <test name="file" compare="contains"><string>retendard-Regular.otf</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Pretendard</string></edit>
    <edit name="style" mode="assign_replace"><string>Regular</string></edit>
    <edit name="weight" mode="assign_replace"><const>regular</const></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>retendard-Bold.otf</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Pretendard</string></edit>
    <edit name="style" mode="assign_replace"><string>Bold</string></edit>
    <edit name="weight" mode="assign_replace"><const>bold</const></edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains"><string>songam_leehyungsik.ttf</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Ian Script</string></edit>
    <edit name="style" mode="assign_replace"><string>Regular</string></edit>
    <edit name="weight" mode="assign_replace"><const>regular</const></edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains"><string>KimjungchulScript-Regular.ttf</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Sihyun Script</string></edit>
    <edit name="style" mode="assign_replace"><string>Regular</string></edit>
    <edit name="weight" mode="assign_replace"><const>regular</const></edit>
  </match>

  <match target="scan">
    <test name="file" compare="contains"><string>Griun_OMIRI-Rg.ttf</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Taeyun Script</string></edit>
    <edit name="style" mode="assign_replace"><string>Regular</string></edit>
    <edit name="weight" mode="assign_replace"><const>regular</const></edit>
  </match>

  <!-- 요청한 고정 패밀리가 우선 검색되도록 명시. -->
  <alias><family>WNF Pretendard</family><prefer><family>WNF Pretendard</family></prefer></alias>
  <alias><family>WNF Ian Script</family><prefer><family>WNF Ian Script</family></prefer></alias>
  <alias><family>WNF Sihyun Script</family><prefer><family>WNF Sihyun Script</family></prefer></alias>
  <alias><family>WNF Taeyun Script</family><prefer><family>WNF Taeyun Script</family></prefer></alias>
</fontconfig>
