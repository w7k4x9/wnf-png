<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 폰트를 fontconfig/ 에 넣든 fonts/ 에 넣든 둘 다 스캔한다. -->
  <dir prefix="relative">.</dir>
  <dir prefix="cwd">fonts</dir>
  <cachedir>/tmp/wnf-fontcache</cachedir>

  <!-- 파일 내부 이름과 무관하게 고정 이름으로 재등록한다.
       Pretendard 는 첫 글자를 뺀 검사로 대소문자 파일명 모두 허용. -->
  <match target="scan">
    <test name="file" compare="contains"><string>retendard-Regular</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Pretendard</string></edit>
    <edit name="style" mode="assign_replace"><string>Regular</string></edit>
    <edit name="weight" mode="assign_replace"><const>regular</const></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>retendard-Bold</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Pretendard</string></edit>
    <edit name="style" mode="assign_replace"><string>Bold</string></edit>
    <edit name="weight" mode="assign_replace"><const>bold</const></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>KimjungchulScript</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Sihyun Script</string></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>songam_leehyungsik</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Ian Script</string></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>Griun_OMIRI</string></test>
    <edit name="family" mode="assign_replace"><string>WNF Taeyun Script</string></edit>
  </match>
</fontconfig>
